services:
  postgres:
    image: postgres:18
    container_name: power-postgres
    env_file: './.env'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - 5432:5432

  redis:
    image: redis:8.4
    container_name: power-redis
    env_file: './.env'
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --user
      - ${REDIS_USERNAME}
      - 'on'
      - '>${REDIS_PASSWORD}'
      - ~*
      - +@all
    ports:
      - 6379:6379
